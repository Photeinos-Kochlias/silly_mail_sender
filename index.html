<!DOCTYPE! html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            font-size: 24px;
            color: #333;
            background-color: #ffffff;
            user-select: none;
        }
    </style>
</head>
<body>
    <h1>Test</h1>
    <button id="send">send</button>
</body>
<script>
    const button = document.getElementById('send');

    if (button) {
        button.addEventListener('click', () => {
            alert('JavaScriptの処理が実行されました！');
            console.log('Button clicked!');
        });
    }
</script>
</html>
