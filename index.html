<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メール送信テスト</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        button { padding: 12px 24px; font-size: 18px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <button id="send">HTMLメールを送信</button>

    <script>
        document.getElementById('send').addEventListener('click', async () => {
            try {
                // バックエンドのメール送信APIを呼び出す
                const response = await fetch('send-email', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    alert('メールを送信しました！');
                } else {
                    alert('エラー: ' + data.message);
                }
            } catch (error) {
                console.error('通信エラー:', error);
                alert('サーバーへの接続に失敗しました。');
            }
        });
    </script>
</body>
</html>
